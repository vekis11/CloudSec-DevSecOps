name: DevSecOps Pipeline - GCP Cloud Run

on:
  push:
    branches: [main, develop]
    paths:
      - 'project-3-gcp-cloudrun-devsecops/**'
      - '.github/workflows/project-3-gcp-cloudrun-devsecops.yml'
  pull_request:
    branches: [main]
    paths:
      - 'project-3-gcp-cloudrun-devsecops/**'

permissions:
  contents: read
  id-token: write
  security-events: write

env:
  GCP_REGION: ${{ vars.GCP_REGION || 'us-central1' }}
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  ARTIFACT_REGISTRY: ${{ vars.ARTIFACT_REGISTRY }}
  CLOUD_RUN_SERVICE: cloudrun-devsecops-service

jobs:
  secret-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast:
    name: SAST (Semgrep + ESLint security)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/javascript
            p/nodejs
            project-3-gcp-cloudrun-devsecops/security/semgrep-rules.yml
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: ESLint security plugin
        working-directory: project-3-gcp-cloudrun-devsecops/app
        run: |
          npm install --no-save eslint eslint-plugin-security
          npx eslint --plugin security --rule 'security/detect-object-injection: warn' server.js || true

  sca:
    name: SCA (Trivy + npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: npm audit
        working-directory: project-3-gcp-cloudrun-devsecops/app
        run: |
          npm install
          npm audit --audit-level=high
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: project-3-gcp-cloudrun-devsecops/app
          scanners: vuln,license,secret
          severity: CRITICAL,HIGH
          exit-code: 1
          format: sarif
          output: trivy-fs.sarif
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-sca

  iac-scan:
    name: IaC Scan (Checkov + tfsec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bridgecrewio/checkov-action@v12
        with:
          directory: project-3-gcp-cloudrun-devsecops/terraform
          framework: terraform
          soft_fail: false
      - uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: project-3-gcp-cloudrun-devsecops/terraform

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - working-directory: project-3-gcp-cloudrun-devsecops/app
        run: |
          npm install
          npm test

  container-scan:
    name: Container Scan (Trivy)
    runs-on: ubuntu-latest
    needs: [secret-scan, sast, sca, iac-scan, unit-tests]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t scan-target:latest project-3-gcp-cloudrun-devsecops/app
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: scan-target:latest
          scanners: vuln,config,secret
          severity: CRITICAL,HIGH
          exit-code: 1

  build-and-deploy:
    name: Build, Push, Deploy to Cloud Run
    runs-on: ubuntu-latest
    needs: [container-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet
      - name: Build and push image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE="${{ env.ARTIFACT_REGISTRY }}/app:${IMAGE_TAG}"
          docker build -t "$IMAGE" -t "${{ env.ARTIFACT_REGISTRY }}/app:latest" project-3-gcp-cloudrun-devsecops/app
          docker push "$IMAGE"
          docker push "${{ env.ARTIFACT_REGISTRY }}/app:latest"
      - name: Deploy to Cloud Run
        run: |
          gcloud run services update ${{ env.CLOUD_RUN_SERVICE }} \
            --image "${{ env.ARTIFACT_REGISTRY }}/app:${{ github.sha }}" \
            --region ${{ env.GCP_REGION }} \
            --project ${{ env.GCP_PROJECT_ID }}
      - name: Smoke test
        run: |
          URL=$(gcloud run services describe ${{ env.CLOUD_RUN_SERVICE }} \
            --region ${{ env.GCP_REGION }} \
            --project ${{ env.GCP_PROJECT_ID }} \
            --format 'value(status.url)')
          curl -sf "${URL}/health"
